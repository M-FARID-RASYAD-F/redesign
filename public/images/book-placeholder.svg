<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="100%" height="100%">
  <defs>
    <linearGradient id="phBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="phSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="phGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="phShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Cover Card -->
  <rect width="320" height="460" rx="8" fill="url(#phBg)"/>

  <!-- Subtle Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="160" cy="205" r="130" fill="none"/>
    <circle cx="160" cy="205" r="95" fill="none" stroke-dasharray="4 4"/>
    <rect x="110" y="155" width="100" height="100" fill="none" transform="rotate(45 160 205)"/>
  </g>

  <!-- Top Header Banner -->
  <g transform="translate(160, 28)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#fde047" letter-spacing="2">PKBM TAHFIZH AT-TAMAM</text>
    <text y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#cbd5e1" letter-spacing="1">PERPUSTAKAAN DIGITAL</text>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(160, 68)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#000000" fill-opacity="0.35" stroke="url(#phGold)" stroke-width="1.2"/>
    <text text-anchor="middle" y="4.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#fde047" letter-spacing="1">KOLEKSI LITERATUR</text>
  </g>

  <!-- Center Graphic Icon -->
  <g transform="translate(160, 195)" filter="url(#phShadow)">
    <circle cx="0" cy="0" r="50" fill="#042f2e" stroke="url(#phGold)" stroke-width="2"/>
    <!-- Book Icon -->
    <g transform="translate(-24, -24)" fill="none" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 39v-30A5 5 0 0 1 9 4H44v38H9a5 5 0 0 0-5 5Z"/>
      <path d="M9 12h26"/>
      <path d="M9 20h26"/>
      <path d="M9 28h16"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="50" y1="285" x2="270" y2="285" stroke="url(#phGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Placeholder Title -->
  <g filter="url(#phShadow)" text-anchor="middle">
    <text x="160" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.3">Katalog Buku</text>
    <text x="160" y="352" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">Perpustakaan At-Tamam</text>
  </g>

  <!-- Subtitle -->
  <text x="160" y="385" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#cbd5e1" opacity="0.9">Koleksi Pengetahuan &amp; Inspirasi</text>

  <!-- Footer Seal -->
  <g transform="translate(160, 436)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">EDISI PERPUSTAKAAN DIGITAL</text>
  </g>

  <!-- Left 3D Spine Fold / Crease -->
  <rect x="0" y="0" width="16" height="460" rx="8" fill="url(#phSpine)"/>
  <line x1="16" y1="0" x2="16" y2="460" stroke="#000000" stroke-width="1" opacity="0.35"/>
  <line x1="17" y1="0" x2="17" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="318" height="458" rx="7" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>
