<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Spine 3D Crease Shadow & Highlight -->
    <linearGradient id="spineCrease11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Metallic Gold/Accent Foil for Badges -->
    <linearGradient id="foilGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Cover Card -->
  <rect width="320" height="460" rx="8" fill="url(#bgGrad11)"/>

  <!-- Subtle Geometric Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="160" cy="205" r="140" fill="none"/>
    <circle cx="160" cy="205" r="110" fill="none" stroke-dasharray="4 4"/>
    <circle cx="160" cy="205" r="80" fill="none"/>
    <line x1="20" y1="205" x2="300" y2="205"/>
    <line x1="160" y1="65" x2="160" y2="345"/>
  </g>

  <!-- Top Header Banner (Library Branding) -->
  <g transform="translate(160, 28)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#fde68a" letter-spacing="2">PKBM TAHFIZH AT-TAMAM</text>
    <text y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#cbd5e1" letter-spacing="1">PERPUSTAKAAN DIGITAL</text>
  </g>

  <!-- Category & Bestseller Badge Pill -->
  <g transform="translate(160, 68)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#000000" fill-opacity="0.35" stroke="url(#foilGrad11)" stroke-width="1.2"/>
    <text text-anchor="middle" y="4.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#fde68a" letter-spacing="1">EDISI POPULER INDONESIA</text>
  </g>

  <!-- Central Themed Artwork Box -->
  <g filter="url(#softShadow11)">
                <g transform="translate(160, 205)">
                <!-- Prehistoric Handprint / Cosmos Silhouette -->
                <circle cx="0" cy="0" r="56" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
                <!-- Celestial Meridian Globe -->
                <ellipse cx="0" cy="0" rx="50" ry="24" fill="none" stroke="#fde68a" stroke-width="1.5" opacity="0.7"/>
                <line x1="0" y1="-50" x2="0" y2="50" stroke="#fde68a" stroke-width="1.5" opacity="0.7"/>
                <!-- Golden Human Handprint Silhouette -->
                <path d="M-15,10 C-18,0 -16,-20 -14,-32 C-12,-34 -7,-33 -8,-22 L-8,5 
                         C-8,-5 -5,-28 -2,-38 C0,-40 5,-39 4,-26 L4,5 
                         C4,-4 7,-25 10,-33 C12,-35 17,-33 15,-22 L14,7 
                         C14,1 18,-15 22,-20 C24,-22 28,-19 25,-10 L20,18 
                         C15,35 0,40 -12,35 C-22,30 -25,18 -15,10 Z" 
                      fill="#fde68a" opacity="0.95"/>
            </g>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="295" x2="270" y2="295" stroke="url(#foilGrad11)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Title Section -->
  <g filter="url(#softShadow11)">
    <text x="160" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.3">Sapiens: Riwayat</text>
<text x="160" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.3">Umat Manusia</text>

  </g>

  <!-- Subtitle -->
  <text x="160" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#e2e8f0" opacity="0.9">Dari Zaman Batu Menuju Kecerdasan Buatan</text>

  <!-- Author Tag with Icon Accent -->
  <g transform="translate(160, 400)">
    <rect x="-95" y="-11" width="190" height="22" rx="6" fill="#000000" fill-opacity="0.3"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#fde68a">Karya: Yuval Noah Harari</text>
  </g>

  <!-- Footer: Publisher & Archive Seal -->
  <g transform="translate(160, 436)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">KPG Gramedia • KOLEKSI RESMI</text>
  </g>

  <!-- Left 3D Spine Fold / Crease (Gives depth and book feel) -->
  <rect x="0" y="0" width="16" height="460" rx="8" fill="url(#spineCrease11)"/>
  <line x1="16" y1="0" x2="16" y2="460" stroke="#000000" stroke-width="1" opacity="0.35"/>
  <line x1="17" y1="0" x2="17" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="318" height="458" rx="7" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>