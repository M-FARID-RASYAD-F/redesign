<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="55%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Spine 3D Crease Shadow & Highlight -->
    <linearGradient id="spineCrease16" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Metallic Gold/Accent Foil for Badges -->
    <linearGradient id="foilGrad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow16" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Cover Card -->
  <rect width="320" height="460" rx="8" fill="url(#bgGrad16)"/>

  <!-- Subtle Geometric Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="160" cy="205" r="140" fill="none"/>
    <circle cx="160" cy="205" r="110" fill="none" stroke-dasharray="4 4"/>
    <circle cx="160" cy="205" r="80" fill="none"/>
    <line x1="20" y1="205" x2="300" y2="205"/>
    <line x1="160" y1="65" x2="160" y2="345"/>
  </g>

  <!-- Top Header Banner (Library Branding) -->
  <g transform="translate(160, 28)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#fef08a" letter-spacing="2">PKBM TAHFIZH AT-TAMAM</text>
    <text y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#cbd5e1" letter-spacing="1">PERPUSTAKAAN DIGITAL</text>
  </g>

  <!-- Category & Bestseller Badge Pill -->
  <g transform="translate(160, 68)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#000000" fill-opacity="0.35" stroke="url(#foilGrad16)" stroke-width="1.2"/>
    <text text-anchor="middle" y="4.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#fef08a" letter-spacing="1">MEGA BESTSELLER NASIONAL</text>
  </g>

  <!-- Central Themed Artwork Box -->
  <g filter="url(#softShadow16)">
                <g transform="translate(160, 205)">
                <!-- 7 Golden Stars of Abundance & Spiral -->
                <path d="M0,0 Q25,-25 45,0 Q60,35 25,50 Q-25,55 -45,20 Q-55,-25 -20,-50 Q25,-60 60,-25" 
                      fill="none" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="3 3"/>
                <!-- 7 Stars array around circle -->
                <g fill="#fef08a">
                    <!-- Star 1 --> <polygon points="0,-52 3,-45 10,-45 4,-41 6,-34 0,-38 -6,-34 -4,-41 -10,-45 -3,-45"/>
                    <!-- Star 2 --> <polygon points="38,-35 40,-28 47,-28 42,-24 43,-17 38,-21 33,-17 34,-24 29,-28 36,-28"/>
                    <!-- Star 3 --> <polygon points="48,8 50,15 57,15 52,19 53,26 48,22 43,26 44,19 39,15 46,15"/>
                    <!-- Star 4 --> <polygon points="22,44 24,51 31,51 26,55 27,62 22,58 17,62 18,55 13,51 20,51"/>
                    <!-- Star 5 --> <polygon points="-22,44 -20,51 -13,51 -18,55 -17,62 -22,58 -27,62 -26,55 -31,51 -24,51"/>
                    <!-- Star 6 --> <polygon points="-48,8 -46,15 -39,15 -44,19 -43,26 -48,22 -53,26 -52,19 -57,15 -50,15"/>
                    <!-- Star 7 --> <polygon points="-38,-35 -36,-28 -29,-28 -34,-24 -33,-17 -38,-21 -43,-17 -42,-24 -47,-28 -40,-28"/>
                </g>
                <circle cx="0" cy="0" r="18" fill="#fef08a" opacity="0.9"/>
                <text x="0" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#422006">7</text>
            </g>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="295" x2="270" y2="295" stroke="url(#foilGrad16)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Title Section -->
  <g filter="url(#softShadow16)">
    <text x="160" y="335" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.3">7 Keajaiban Rezeki</text>

  </g>

  <!-- Subtitle -->
  <text x="160" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#e2e8f0" opacity="0.9">Percepatan Sukses &amp; Otak Kanan</text>

  <!-- Author Tag with Icon Accent -->
  <g transform="translate(160, 400)">
    <rect x="-95" y="-11" width="190" height="22" rx="6" fill="#000000" fill-opacity="0.3"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#fef08a">Karya: Ippho Santosa</text>
  </g>

  <!-- Footer: Publisher & Archive Seal -->
  <g transform="translate(160, 436)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">Elex Media Komputindo • KOLEKSI RESMI</text>
  </g>

  <!-- Left 3D Spine Fold / Crease (Gives depth and book feel) -->
  <rect x="0" y="0" width="16" height="460" rx="8" fill="url(#spineCrease16)"/>
  <line x1="16" y1="0" x2="16" y2="460" stroke="#000000" stroke-width="1" opacity="0.35"/>
  <line x1="17" y1="0" x2="17" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="318" height="458" rx="7" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>