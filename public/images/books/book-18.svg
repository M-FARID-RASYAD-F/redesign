<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Spine 3D Crease Shadow & Highlight -->
    <linearGradient id="spineCrease18" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Metallic Gold/Accent Foil for Badges -->
    <linearGradient id="foilGrad18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow18" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Cover Card -->
  <rect width="320" height="460" rx="8" fill="url(#bgGrad18)"/>

  <!-- Subtle Geometric Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="160" cy="205" r="140" fill="none"/>
    <circle cx="160" cy="205" r="110" fill="none" stroke-dasharray="4 4"/>
    <circle cx="160" cy="205" r="80" fill="none"/>
    <line x1="20" y1="205" x2="300" y2="205"/>
    <line x1="160" y1="65" x2="160" y2="345"/>
  </g>

  <!-- Top Header Banner (Library Branding) -->
  <g transform="translate(160, 28)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#facc15" letter-spacing="2">PKBM TAHFIZH AT-TAMAM</text>
    <text y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#cbd5e1" letter-spacing="1">PERPUSTAKAAN DIGITAL</text>
  </g>

  <!-- Category & Bestseller Badge Pill -->
  <g transform="translate(160, 68)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#000000" fill-opacity="0.35" stroke="url(#foilGrad18)" stroke-width="1.2"/>
    <text text-anchor="middle" y="4.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#facc15" letter-spacing="1">ENTREPRENEUR MUSLIM</text>
  </g>

  <!-- Central Themed Artwork Box -->
  <g filter="url(#softShadow18)">
                <g transform="translate(160, 205)">
                <!-- Golden Dinar & Barakah Wealth Wheat Sheaves -->
                <circle cx="0" cy="0" r="45" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="3 3"/>
                <circle cx="0" cy="0" r="38" fill="#064e3b" stroke="#facc15" stroke-width="2.5"/>
                <!-- Arabic Gold Coin Emblem -->
                <polygon points="0,-22 6,-15 15,-15 8,-9 11,-1 0,-6 -11,-1 -8,-9 -15,-15 -6,-15" fill="#facc15"/>
                <circle cx="0" cy="8" r="8" fill="none" stroke="#facc15" stroke-width="2"/>
                <text x="0" y="13" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#facc15">Rp</text>
                <!-- Merchant Ship Sail -->
                <path d="M-25,28 Q0,38 25,28 Q18,48 -20,44 Z" fill="#facc15"/>
            </g>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="295" x2="270" y2="295" stroke="url(#foilGrad18)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Title Section -->
  <g filter="url(#softShadow18)">
    <text x="160" y="335" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.3">Wirausaha Berkah</text>

  </g>

  <!-- Subtitle -->
  <text x="160" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#e2e8f0" opacity="0.9">Sukses Bisnis Entrepreneur Muslim</text>

  <!-- Author Tag with Icon Accent -->
  <g transform="translate(160, 400)">
    <rect x="-95" y="-11" width="190" height="22" rx="6" fill="#000000" fill-opacity="0.3"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#facc15">Karya: Dr. M. Syafii Antonio, M.Ec.</text>
  </g>

  <!-- Footer: Publisher & Archive Seal -->
  <g transform="translate(160, 436)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">Tazkia Publishing • KOLEKSI RESMI</text>
  </g>

  <!-- Left 3D Spine Fold / Crease (Gives depth and book feel) -->
  <rect x="0" y="0" width="16" height="460" rx="8" fill="url(#spineCrease18)"/>
  <line x1="16" y1="0" x2="16" y2="460" stroke="#000000" stroke-width="1" opacity="0.35"/>
  <line x1="17" y1="0" x2="17" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="318" height="458" rx="7" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>