<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="55%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Spine 3D Crease Shadow & Highlight -->
    <linearGradient id="spineCrease4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Metallic Gold/Accent Foil for Badges -->
    <linearGradient id="foilGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Cover Card -->
  <rect width="320" height="460" rx="8" fill="url(#bgGrad4)"/>

  <!-- Subtle Geometric Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="160" cy="205" r="140" fill="none"/>
    <circle cx="160" cy="205" r="110" fill="none" stroke-dasharray="4 4"/>
    <circle cx="160" cy="205" r="80" fill="none"/>
    <line x1="20" y1="205" x2="300" y2="205"/>
    <line x1="160" y1="65" x2="160" y2="345"/>
  </g>

  <!-- Top Header Banner (Library Branding) -->
  <g transform="translate(160, 28)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#fde047" letter-spacing="2">PKBM TAHFIZH AT-TAMAM</text>
    <text y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#cbd5e1" letter-spacing="1">PERPUSTAKAAN DIGITAL</text>
  </g>

  <!-- Category & Bestseller Badge Pill -->
  <g transform="translate(160, 68)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#000000" fill-opacity="0.35" stroke="url(#foilGrad4)" stroke-width="1.2"/>
    <text text-anchor="middle" y="4.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#fde047" letter-spacing="1">RUJUKAN UTAMA NUSANTARA</text>
  </g>

  <!-- Central Themed Artwork Box -->
  <g filter="url(#softShadow4)">
                <g transform="translate(160, 205)">
                <!-- Islamic 8-Point Star Mandala Backdrop -->
                <g fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.4">
                    <rect x="-42" y="-42" width="84" height="84" rx="4"/>
                    <rect x="-42" y="-42" width="84" height="84" rx="4" transform="rotate(45)"/>
                </g>
                <!-- Holy Quran on Rehal (Stand) -->
                <g transform="translate(0, -10)">
                    <!-- Open Quran Pages -->
                    <path d="M0,0 C-15,-20 -45,-15 -60,-8 L-60,25 C-45,18 -15,13 0,32 C15,13 45,18 60,25 L60,-8 C45,-15 15,-20 0,0 Z" 
                          fill="#f8fafc" stroke="#fde047" stroke-width="2"/>
                    <!-- Page Spine line -->
                    <line x1="0" y1="0" x2="0" y2="32" stroke="#fde047" stroke-width="2.5"/>
                    <!-- Rehal Stand Wood Silhouette -->
                    <path d="M-35,28 L0,52 L35,28 L28,45 L0,62 L-28,45 Z" fill="#fde047" opacity="0.95"/>
                    <path d="M-20,40 L0,55 L20,40 L0,25 Z" fill="#b45309" opacity="0.8"/>
                </g>
                <!-- Divine Crescent & Star on top -->
                <path d="M-8,-62 A14,14 0 1,0 12,-42 A11,11 0 1,1 -8,-62 Z" fill="#fde047"/>
                <polygon points="12,-55 14,-50 19,-50 15,-47 16,-42 12,-45 8,-42 9,-47 5,-50 10,-50" fill="#fde047"/>
            </g>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="295" x2="270" y2="295" stroke="url(#foilGrad4)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Title Section -->
  <g filter="url(#softShadow4)">
    <text x="160" y="335" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.3">Tafsir Al-Azhar</text>

  </g>

  <!-- Subtitle -->
  <text x="160" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#e2e8f0" opacity="0.9">Jilid Lengkap Mahakarya Nusantara</text>

  <!-- Author Tag with Icon Accent -->
  <g transform="translate(160, 400)">
    <rect x="-95" y="-11" width="190" height="22" rx="6" fill="#000000" fill-opacity="0.3"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#fde047">Karya: Prof. Dr. Buya Hamka</text>
  </g>

  <!-- Footer: Publisher & Archive Seal -->
  <g transform="translate(160, 436)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">Gema Insani Press • KOLEKSI RESMI</text>
  </g>

  <!-- Left 3D Spine Fold / Crease (Gives depth and book feel) -->
  <rect x="0" y="0" width="16" height="460" rx="8" fill="url(#spineCrease4)"/>
  <line x1="16" y1="0" x2="16" y2="460" stroke="#000000" stroke-width="1" opacity="0.35"/>
  <line x1="17" y1="0" x2="17" y2="460" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="318" height="458" rx="7" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>