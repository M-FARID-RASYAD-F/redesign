<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="spineShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="400" rx="8" fill="url(#bookCoverGrad)" />
  <!-- Spine edge shadow -->
  <rect x="0" y="0" width="22" height="400" fill="url(#spineShade)" />
  <line x1="22" y1="0" x2="22" y2="400" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />
  <!-- Embossed geometric decoration -->
  <rect x="36" y="24" width="236" height="352" rx="6" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="150" cy="160" r="54" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
  <!-- Book Icon in Center -->
  <g transform="translate(126, 136)" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    <line x1="9" y1="7" x2="16" y2="7"/>
    <line x1="9" y1="11" x2="14" y2="11"/>
  </g>
  <!-- Text Label -->
  <text x="150" y="255" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">BUKU PERPUSTAKAAN</text>
  <text x="150" y="280" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">At-Tamam Digital Library</text>
  <!-- Bottom bars -->
  <rect x="80" y="325" width="140" height="3" rx="1.5" fill="#00b4d8" fill-opacity="0.4" />
</svg>
